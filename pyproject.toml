[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "liteocr"
version = "0.1.0"
description = "One API for every OCR / document-parsing provider (Reducto, Extend, LlamaParse, ...). Rust core, Python SDK, open benchmark."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "LiteOCR contributors" }]
keywords = ["ocr", "document-parsing", "pdf", "reducto", "extend", "llamaparse", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Text Processing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.8", "maturin>=1.5"]
bench = ["pillow>=10"]

[project.urls]
Homepage = "https://github.com/ajinkyashejul/liteocr"
Repository = "https://github.com/ajinkyashejul/liteocr"
Issues = "https://github.com/ajinkyashejul/liteocr/issues"
Changelog = "https://github.com/ajinkyashejul/liteocr/blob/main/CHANGELOG.md"

[tool.maturin]
manifest-path = "crates/liteocr-python/Cargo.toml"
python-source = "python"
module-name = "liteocr._core"
features = ["pyo3/extension-module"]
strip = true

[tool.ruff]
line-length = 110
target-version = "py39"
extend-exclude = ["target"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["UP007", "UP045", "RUF012"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "liteocr._core"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["python/tests"]
asyncio_mode = "auto"
