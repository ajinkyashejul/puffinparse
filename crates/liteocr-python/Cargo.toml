[package]
name = "liteocr-python"
description = "PyO3 bindings for LiteOCR (the `liteocr._core` extension module)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
liteocr-core = { workspace = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pythonize = "0.29"
tokio = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
tracing-subscriber = { workspace = true }
