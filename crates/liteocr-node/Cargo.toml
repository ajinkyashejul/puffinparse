[package]
name = "liteocr-node"
description = "Node.js (N-API) bindings for LiteOCR: the native addon behind the `liteocr` npm package."
version.workspace = true
edition.workspace = true
# napi 3 needs a newer toolchain than the rest of the workspace.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
liteocr-core = { workspace = true }
# `dyn-symbols` resolves every napi_* symbol when Node loads the addon rather than at link time, so
# this crate builds, lints and tests without Node.js: `cargo test --workspace` stays node-free.
napi = { version = "3", default-features = false, features = ["napi4", "dyn-symbols", "async", "serde-json"] }
napi-derive = "3"
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
napi-build = "2"
