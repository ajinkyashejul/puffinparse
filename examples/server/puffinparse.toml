# PuffinParse gateway config. Run with:  puffinparse serve --config examples/server/puffinparse.toml
# Full reference: docs/SERVER.md. Secrets are "env:VAR" references, resolved at startup.

# Full-access token (all models, no budget or rate limit). Omit it and all [[keys]] to run an
# open gateway (only do that on localhost).
master_key = "env:PUFFINPARSE_MASTER_KEY"

[server]
host = "127.0.0.1"          # use 0.0.0.0 in a container
port = 4000
log_stdout = true           # JSON-lines request log on stdout
# log_file = "puffinparse-requests.jsonl"
# state_file = "puffinparse-usage.json"   # keeps per-key monthly spend across restarts
max_body_mb = 50
max_timeout_secs = 300
max_retries = 2
allow_direct_models = true  # false = clients may only use the aliases below
job_retention_hours = 168   # POST /v1/jobs handles stay readable this long

# Optional receiver for provider webhooks about jobs submitted through POST /v1/jobs.
# [webhooks]
# enabled = true
# secret = "env:PUFFINPARSE_WEBHOOK_SECRET"   # providers call /v1/webhooks/<provider>?token=<secret>

# Provider credentials. Without an entry the core reads the provider's default env var anyway;
# listing them here makes the dependency explicit and lets you rename the variable.
[providers.reducto]
api_key = "env:REDUCTO_API_KEY"

[providers.extend]
api_key = "env:EXTEND_API_KEY"

[providers.llamaparse]
api_key = "env:LLAMA_API_KEY"

# Aliases: what clients send as "model". Targets are tried per strategy; on an error whose kind
# is in fallback_on (default: provider, rate_limit, timeout, network) the next one is tried.
[[models]]
name = "invoices"
targets = ["reducto/standard", "extend/parse_performance"]
strategy = "ordered"

[[models]]
name = "cheap"
targets = ["llamaparse/cost_effective", "extend/parse_light"]
strategy = "round_robin"

[[models]]
name = "invoice-fields"
targets = ["reducto/extract", "extend/extraction_performance"]

# Virtual keys handed to clients. `id` appears in logs and metrics; `key` never does.
[[keys]]
id = "billing-team"
key = "env:PUFFINPARSE_KEY_BILLING"
models = ["invoices", "invoice-fields"]
monthly_budget_usd = 50.0
rpm = 60

[[keys]]
id = "research"
key = "env:PUFFINPARSE_KEY_RESEARCH"
models = ["cheap", "llamaparse/*"]
monthly_budget_usd = 5.0
rpm = 10
