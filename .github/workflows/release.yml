name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- wheels --
  linux:
    name: Wheel · linux-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist --interpreter python3.9
          sccache: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  macos:
    name: Wheel · macos-${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter python3.9
          sccache: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  windows:
    name: Wheel · windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist --interpreter python3.9
          sccache: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist
          if-no-files-found: error

  # ------------------------------------------------------------ CLI binaries --
  cli:
    name: CLI · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build -p liteocr-cli --release --target ${{ matrix.target }}

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/liteocr-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" liteocr

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/liteocr.exe" `
            -DestinationPath "dist/liteocr-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  # ----------------------------------------------------------------- publish --
  publish:
    name: Publish to PyPI and create the GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist, cli]
    environment: pypi
    permissions:
      # `id-token: write` is what lets pypa/gh-action-pypi-publish authenticate
      # with PyPI via OIDC ("trusted publishing") instead of an API token.
      #
      # MAINTAINER SETUP (once, before the first release):
      #   PyPI → project `liteocr` → Publishing → "Add a new pending publisher"
      #     Owner:            ajinkyashejul
      #     Repository name:  liteocr
      #     Workflow name:    release.yml
      #     Environment name: pypi
      #   Then create a GitHub environment called `pypi` in the repo settings
      #   (Settings → Environments) and, optionally, add required reviewers.
      # No PyPI token/secret is needed — do not add one.
      id-token: write
      # Needed to create the GitHub Release and upload the CLI archives.
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect wheels and sdist
        run: |
          mkdir -p dist
          find artifacts -path 'artifacts/wheels-*' -type f \
            \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          ls -l dist

      - name: Collect CLI archives
        run: |
          mkdir -p cli-dist
          find artifacts -path 'artifacts/cli-*' -type f \
            \( -name 'liteocr-*.tar.gz' -o -name 'liteocr-*.zip' \) -exec cp {} cli-dist/ \;
          ls -l cli-dist

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            cli-dist/*
            dist/*.whl
            dist/*.tar.gz
