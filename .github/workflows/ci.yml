name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Live provider tests are `#[ignore]`d and/or skip themselves when
      # REDUCTO_API_KEY / EXTEND_API_KEY / LLAMA_API_KEY are absent, so CI
      # deliberately sets no provider secrets: this run is offline.
      - name: Test
        run: cargo test --workspace

      - name: Build CLI (release)
        run: cargo build -p liteocr-cli --release

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: liteocr-cli-linux-x86_64
          path: target/release/liteocr
          if-no-files-found: error
          retention-days: 7

  python:
    name: Python ${{ matrix.python-version }} (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # maturin develop installs into an active virtualenv, so create one and
      # put it on PATH for every later step in this job.
      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install maturin ruff mypy pytest pytest-asyncio

      # Builds crates/liteocr-python into the venv as `liteocr._core`,
      # driven by the root pyproject.toml ([tool.maturin] manifest-path).
      - name: Build and install the extension module
        run: maturin develop --release

      - name: Ruff lint
        run: ruff check python/ benchmark/

      - name: Ruff format check
        run: ruff format --check python/ benchmark/

      - name: Mypy
        run: mypy python/liteocr

      # No provider API keys are set here on purpose: the live provider tests
      # skip themselves when REDUCTO_API_KEY / EXTEND_API_KEY / LLAMA_API_KEY
      # are missing.
      - name: Pytest
        run: pytest python/tests -q
