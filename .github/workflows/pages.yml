name: Pages

# Publishes the whole PuffinParse site to GitHub Pages: the landing page, the docs under
# /docs/ and the benchmark results viewer under /benchmark-results/. This is the same
# build Vercel runs (website/build.py, which invokes benchmark/site/build.py itself), so
# Pages mirrors https://puffinparse.vercel.app rather than publishing a different artefact.
#
# SETUP (one time, by a maintainer): in the repository settings open
# Settings -> Pages and set "Source" to "GitHub Actions". Until that is done this
# workflow builds fine but the deploy step fails with "Pages is not enabled".
#
# TODO: the viewer is moving to a React app (Extend UI) under benchmark/site/app/.
# When that lands, add an `npm ci && npm run build` stage before the Python build
# (or after it, feeding it `site-dist/benchmark-results/data/`) and upload the app's
# bundle together with the generated `data/` directory. `benchmark/site/build.py`
# already writes everything the front-end needs under `<out>/data/`, so no data changes
# are required.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let a newer commit finish rather than
# cancelling an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # markdown renders the docs; Pillow is optional and only used to render page 1
      # of PDF inputs into a preview PNG for the results viewer.
      - name: Install build dependencies
        run: python -m pip install --upgrade pip markdown pillow pypdfium2

      # A GitHub Pages project site is served from /<repo>/, so links and canonical URLs
      # are built for that prefix. --with-benchmark is on by default, so this one command
      # produces the landing page, /docs/ and /benchmark-results/.
      - name: Build the site (landing + docs + benchmark results viewer)
        run: |
          python website/build.py \
            --out site-dist \
            --base-url "/${{ github.event.repository.name }}" \
            --site-url "${{ steps.pages.outputs.base_url }}" \
            --check

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
